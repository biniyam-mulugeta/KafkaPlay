name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the feature you have in mind.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: checkboxes
    id: generic
    attributes:
      label: Applicability
      options:
        - label: This would be useful against any Kafka cluster, not only my own setup
          required: true
