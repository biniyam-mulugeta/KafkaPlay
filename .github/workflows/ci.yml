name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e "./backend[codecs,oidc,dev]"

      - name: Ruff
        run: |
          ruff check backend/app backend/tests backend/healthcheck.py
          ruff format --check backend/app backend/tests backend/healthcheck.py

      - name: Mypy
        working-directory: backend
        run: mypy app healthcheck.py

      - name: Unit tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npx vite build

  integration:
    name: Integration (${{ matrix.broker.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        broker:
          - name: kafka-3.9
            image: apache/kafka:3.9.1
          - name: kafka-4.x
            image: apache/kafka:4.3.1
          - name: redpanda
            image: redpandadata/redpanda:v26.2.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e "./backend[codecs,oidc,dev]"

      - name: Start broker
        run: ./.github/scripts/start-broker.sh "${{ matrix.broker.image }}" "${{ matrix.broker.name }}"

      - name: Integration tests
        working-directory: backend
        env:
          KAFKAPLAY_TEST_BOOTSTRAP: localhost:9092
        run: pytest -q -m integration

      - name: Broker logs on failure
        if: failure()
        run: docker logs test-broker || true

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the dev stack
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for the console
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "console is up"; exit 0
            fi
            sleep 5
          done
          echo "console never became healthy"
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        env:
          KAFKAPLAY_E2E_URL: http://127.0.0.1:8080
        run: npx playwright test

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

  image:
    name: Image build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kafkaplay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          bytes=$(docker image inspect kafkaplay:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB"
          # The stated budget is ~250 MB; fail if we drift well past it.
          if [ "$bytes" -gt 314572800 ]; then
            echo "::error::image exceeds the 300 MB ceiling"
            exit 1
          fi

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kafkaplay:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
