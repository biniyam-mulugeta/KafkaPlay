  #   security_protocol: SSL
  #   tls:
  #     ca_location: /config/certs/ca.pem
  #     certificate_location: /config/certs/client.pem
  #     key_location: /config/certs/client.key
  #     key_password: ${CLIENT_KEY_PASSWORD}

